name: Debug OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug-oidc:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Get OIDC token and show claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com")

            const payload = token.split(".")[1]
            const decoded = JSON.parse(
              Buffer.from(payload, "base64url").toString("utf8")
            )

            console.log("iss:", decoded.iss)
            console.log("aud:", decoded.aud)
            console.log("sub:", decoded.sub)
            console.log("repository:", decoded.repository)
            console.log("repository_id:", decoded.repository_id)
            console.log("repository_owner:", decoded.repository_owner)
            console.log("repository_owner_id:", decoded.repository_owner_id)
            console.log("environment:", decoded.environment)
